{{- /* One ServiceAccount per workload, so each has an identity of its own
       for the AuthorizationPolicies to name. None carries a token: nothing
       here calls the Kubernetes API. */}}
{{- range $component := list "web" "api" "admin" "fetcher" }}
{{- if or (ne $component "fetcher") $.Values.fetcher.enabled }}
{{- $ctx := dict "root" $ "component" $component }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trailhead.componentName" $ctx }}
  {{- include "trailhead.metadata" $ctx | nindent 2 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
