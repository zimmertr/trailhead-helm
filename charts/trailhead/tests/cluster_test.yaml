# The database: the CloudNativePG `cluster` subchart, under the `database`
# alias, fetched by the chart module before the suites run.
suite: database
templates:
  - charts/database/templates/cluster.yaml
release:
  namespace: trailhead-system
tests:
  - it: runs the database as three instances, with a budget
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Cluster
      - equal:
          path: spec.instances
          value: 3
      - equal:
          path: spec.enablePDB
          value: true

  # A preview has a database of its own, and a budget on its one instance
  # would block every node drain.
  - it: runs a preview's database as one instance, with no budget
    release:
      namespace: trailhead-pr-system
    values:
      - ../values-preview.yaml
    set:
      ingress.hosts: [pr-1.example.test]
      admin.ingress.hosts: [admin.pr-1.example.test]
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Cluster
      - equal:
          path: spec.instances
          value: 1
      - equal:
          path: spec.enablePDB
          value: false
