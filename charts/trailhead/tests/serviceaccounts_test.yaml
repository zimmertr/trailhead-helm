# The account each pod names (rollouts_test.yaml, fetcher-cronjob_test.yaml)
# is rendered, and none mounts a token.
suite: serviceaccounts
templates:
  - serviceaccounts.yaml
release:
  namespace: trailhead-system
tests:
  - it: gives each workload an account that mounts no token
    asserts:
      - hasDocuments:
          count: 4
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: RELEASE-NAME-fetcher
          any: true
      - equal: &no-token
          path: automountServiceAccountToken
          value: false
      - &web
        containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: RELEASE-NAME-web
          any: true
      - &api
        containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: RELEASE-NAME-api
          any: true
      - &admin
        containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: RELEASE-NAME-admin
          any: true

  - it: gives each workload an account that mounts no token in a preview
    release:
      namespace: trailhead-pr-system
    values:
      - ../values-preview.yaml
    set:
      ingress.hosts: [pr-1.example.test]
      admin.ingress.hosts: [admin.pr-1.example.test]
    asserts:
      - hasDocuments:
          count: 3
      - equal: *no-token
      - *web
      - *api
      - *admin
