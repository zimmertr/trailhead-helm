name: Chart PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: chart-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # yggdrasil's chart module: the database subchart fetched, then `helm lint`
  # and a render with the defaults (the stable release, on placeholder hosts)
  # on the Helm version the release packages with, then the helm-unittest
  # suites in charts/trailhead/tests/. The suites hold every rule the chart's
  # README promises, on the stable release and on a PR preview. The check is
  # `Chart / Chart`. Decision records 0001 and 0005.
  chart:
    name: Chart
    uses: zimmertr/yggdrasil/.github/workflows/chart.yml@f5661bbe5864dfae07e6dbd603489e2326980b3d # v2.0.0
    permissions:
      contents: read
    with:
      chart: charts/trailhead
